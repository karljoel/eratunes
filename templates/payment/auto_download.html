{% extends 'base.html' %}
{% block content %}

<div class="container text-center mt-5 pt-5">
    <div class="card bg-dark border-success mx-auto" style="max-width: 500px;">
        <div class="card-body p-5">
            <i class="bi bi-check-circle-fill text-success" style="font-size: 4rem;"></i>
            <h2 class="text-success mt-3">Payment Successful!</h2>
            <h5 class="text-white mt-2">"{{ song_title }}"</h5>
            <p class="text-secondary">Your download will start automatically...</p>
            
            <div class="spinner-border text-success mt-3" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            
            <div class="mt-4">
                <a href="{% url 'home' %}" class="btn btn-outline-secondary">
                    <i class="bi bi-house me-2"></i>Go Home
                </a>
            </div>
            
            <p class="text-secondary small mt-3">
                <i class="bi bi-info-circle"></i> You can only download this song once.
            </p>
        </div>
    </div>
</div>

<script>
    // Auto download after 2 seconds (only once)
    var downloadStarted = false;
    
    setTimeout(function() {
        if (!downloadStarted) {
            downloadStarted = true;
            var downloadUrl = "{{ song_url }}";
            var link = document.createElement('a');
            link.href = downloadUrl;
            link.download = '';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    }, 2000);
    
    // Prevent multiple downloads if user clicks anything
    document.addEventListener('click', function() {
        // Do nothing - no manual download button anymore
    });
</script>

{% endblock %}
