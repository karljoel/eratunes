{% extends 'base.html' %}
{% block content %}

<div class="container mt-4" style="max-width: 500px;">
    <h1 class="fw-bold text-white mb-4">Create New Playlist</h1>
    
    <div class="card bg-dark border-secondary">
        <div class="card-body">
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label class="form-label text-white">Playlist Name</label>
                    <input type="text" name="name" class="form-control bg-dark text-white border-secondary" required>
                </div>
                
                <div class="mb-3">
                    <label class="form-label text-white">Cover Image (optional)</label>
                    <input type="file" name="cover_image" class="form-control bg-dark text-white border-secondary" accept="image/*">
                </div>
                
                <div class="mb-3 form-check">
                    <input type="checkbox" name="is_public" class="form-check-input" id="is_public" checked>
                    <label class="form-check-label text-white" for="is_public">Make playlist public (anyone can view)</label>
                </div>
                
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-success px-4">Create Playlist</button>
                    <a href="{% url 'my_playlists' %}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
