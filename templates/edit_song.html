<!DOCTYPE html>
<html>
<head>
    <title>Edit Song - EraTunes</title>
</head>
<body>
    <h1>Edit Song: {{ song.title }}</h1>

    {% if messages %}
        {% for message in messages %}
            <p style="color:green;">{{ message }}</p>
        {% endfor %}
    {% endif %}

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save Changes</button>
    </form>

    <p><a href="{% url 'artist_dashboard' %}">Back to Dashboard</a></p>
</body>
</html>
