{% extends 'base.html' %}
{% block content %}

<style>
    .mixes-header {
        background: linear-gradient(135deg, #1a1a1a, #0a0a0a);
        padding: 40px 0;
        margin-bottom: 30px;
        border-bottom: 1px solid #ff8c00;
    }
    
    .mix-card {
        background: #181818;
        border-radius: 12px;
        overflow: hidden;
        transition: 0.3s;
        cursor: pointer;
    }
    
    .mix-card:hover {
        background: #282828;
        transform: translateY(-5px);
    }
    
    .mix-card img {
        width: 100%;
        aspect-ratio: 1/1;
        object-fit: cover;
    }
    
    .mix-info {
        padding: 12px;
    }
    
    .mix-title {
        font-size: 0.9rem;
        font-weight: bold;
        margin-bottom: 4px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    
    .mix-dj {
        font-size: 0.75rem;
        color: #aaa;
        margin-bottom: 8px;
    }
    
    .play-btn {
        background: #1db954;
        border: none;
        border-radius: 50%;
        width: 32px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: 0.2s;
    }
    
    .play-btn:hover {
        background: white;
        transform: scale(1.05);
    }
    
    .play-btn i {
        color: black;
    }
    
    @media (max-width: 768px) {
        .mix-title {
            font-size: 0.8rem;
        }
    }
</style>

<div class="mixes-header">
    <div class="container">
        <div class="text-center">
            <h1 class="display-4 fw-bold text-white">DJ Mixes</h1>
            <p class="text-secondary">Professional mixes from top DJs</p>
        </div>
    </div>
</div>

<div class="container mb-5">
    <div class="row g-4">
        {% for mix in mixes %}
        <div class="col-6 col-md-4 col-lg-3">
            <div class="mix-card">
                <img src="{{ mix.cover_image.url }}" onclick="playMix('{{ mix.audio_file.url }}', '{{ mix.title|escapejs }}', '{{ mix.dj_name|escapejs }}', '{{ mix.cover_image.url }}', {{ mix.id }})">
                <div class="mix-info">
                    <div class="mix-title">{{ mix.title }}</div>
                    <div class="mix-dj">by {{ mix.dj_name }}</div>
                    <div class="d-flex justify-content-between align-items-center mt-2">
                        <small class="text-secondary">{{ mix.play_count }} plays</small>
                        <button class="play-btn" onclick="playMix('{{ mix.audio_file.url }}', '{{ mix.title|escapejs }}', '{{ mix.dj_name|escapejs }}', '{{ mix.cover_image.url }}', {{ mix.id }})">
                            <i class="bi bi-play-fill"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
        {% empty %}
        <div class="col-12 text-center py-5">
            <i class="bi bi-vinyl-fill display-1 text-secondary"></i>
            <p class="text-secondary mt-3">No DJ mixes available yet.</p>
        </div>
        {% endfor %}
    </div>
</div>

<script>
function playMix(audioUrl, title, djName, coverImg, mixId) {
    const mixQueue = [{
        id: mixId,
        title: title,
        artist: "DJ " + djName,
        img: coverImg,
        audio: audioUrl
    }];
    
    if (typeof setPlayerQueue === 'function') {
        setPlayerQueue(mixQueue, audioUrl);
    }
    playSong(audioUrl, title, "DJ " + djName, coverImg, mixId, mixQueue);
}
</script>

{% endblock %}
